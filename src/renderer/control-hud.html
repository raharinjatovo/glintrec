<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; script-src 'self' app:; style-src 'self' app: 'unsafe-inline'" />
  <title>Contrôles</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; font: 12px "Segoe UI", system-ui, sans-serif; user-select: none; }
    #bar { box-sizing: border-box; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 0 8px;
      border-radius: 22px; background: rgba(20, 22, 26, .92); color: #e8eaed; border: 1.5px solid #3a3f48; }
    button { font: inherit; color: inherit; background: #2b2f36; border: 1px solid #3a3f48; border-radius: 15px; height: 30px; padding: 0 12px;
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { background: #3a3f48; }
    button:disabled { opacity: .45; cursor: default; }
    #stop { background: #c0392b; border-color: #c0392b; }
    #stop:hover { background: #e04a39 !important; }
    #pause[data-paused="true"] { background: #1e8e5a; border-color: #1e8e5a; }
    /* No drag region anywhere: on Windows -webkit-app-region:drag swallows clicks. */
    html, body, #bar, button { -webkit-app-region: no-drag; }
    svg { width: 12px; height: 12px; fill: currentColor; }
  </style>
</head>
<body>
  <div id="bar">
    <button id="pause" type="button" data-paused="false"><svg id="pause-icon" viewBox="0 0 12 12"><path d="M2 1h3v10H2zM7 1h3v10H7z"/></svg><span id="pause-label">Pause</span></button>
    <button id="mode" type="button"><span id="mode-label">Cam seule</span></button>
    <button id="stop" type="button" title="Arrêter"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8"/></svg><span id="stop-label">Arrêter</span></button>
  </div>
  <script src="control-hud.js"></script>
</body>
</html>
